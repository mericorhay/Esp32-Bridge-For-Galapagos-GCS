[platformio]
src_dir = main
default_envs = esp32s3

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
board_build.flash_mode = dio

[env:esp32]
board = esp32dev
build_flags = -DTARGET_ESP32=1

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = -DTARGET_ESP32S3=1

[env:esp32c3]
board = esp32-c3-devkitc-02
build_flags = -DTARGET_ESP32C3=1
